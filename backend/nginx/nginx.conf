user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # HTTPS 服务器配置（腾讯云 SSL 证书）
    server {
        listen 443 ssl http2;
        server_name forgetting-curve.cpxdmz.top;

        # SSL 证书配置（腾讯云证书文件）
        # 请将腾讯云下载的证书文件放置在 nginx/certs/ 目录下
        # 证书文件：forgetting-curve.cpxdmz.top_bundle.crt
        # 私钥文件：forgetting-curve.cpxdmz.top.key
        ssl_certificate /etc/nginx/certs/forgetting-curve.cpxdmz.top_bundle.crt;
        ssl_certificate_key /etc/nginx/certs/forgetting-curve.cpxdmz.top.key;

        # SSL 配置（参考腾讯云推荐配置）
        ssl_session_timeout 5m;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        # 反向代理到后端服务
        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket 支持（如果需要）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 健康检查端点
        location /health {
            access_log off;
            proxy_pass http://backend:8000/health;
        }
    }

    # HTTP 服务器配置（自动跳转到 HTTPS）
    server {
        listen 80;
        server_name forgetting-curve.cpxdmz.top;

        # 将 HTTP 请求自动跳转到 HTTPS
        return 301 https://$host$request_uri;
    }
}

