syntax = "proto3";

package api.student.v1;

import "google/api/annotations.proto";
import "common.proto";

option go_package = "backend/api/student/v1;v1";

service StudentService {
  // 添加学生
  rpc CreateStudent (CreateStudentRequest) returns (CreateStudentReply) {
    option (google.api.http) = {
      post: "/api/v1/students"
      body: "*"
    };
  }

  // 获取学生信息
  rpc GetStudent (GetStudentRequest) returns (GetStudentReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{id}"
    };
  }

  // 批量添加单词到学生名下
  rpc BatchAddWords (BatchAddWordsRequest) returns (BatchAddWordsReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/words/batch"
      body: "*"
    };
  }

  // 获取学生的单词列表
  rpc GetStudentWords (GetStudentWordsRequest) returns (GetStudentWordsReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{student_id}/words"
    };
  }

  // 获取今日需要背诵的单词（根据艾宾浩斯曲线）
  rpc GetTodayWords (GetTodayWordsRequest) returns (GetTodayWordsReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{student_id}/words/today"
    };
  }

  // 获取计划的今日需要背诵的单词（根据艾宾浩斯曲线）
  rpc GetPlanTodayWords (GetPlanTodayWordsRequest) returns (GetPlanTodayWordsReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{student_id}/plans/{plan_id}/words/today"
    };
  }

  // 标记单词为已复习
  rpc MarkWordReviewed (MarkWordReviewedRequest) returns (MarkWordReviewedReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/words/{word_id}/review"
      body: "*"
    };
  }

  // 通过openid获取或创建学生（微信登录）
  rpc GetOrCreateStudentByOpenid (GetOrCreateStudentByOpenidRequest) returns (GetOrCreateStudentByOpenidReply) {
    option (google.api.http) = {
      post: "/api/v1/students/by-openid"
      body: "*"
    };
  }

  // 添加混淆词
  rpc AddConfusedWord (AddConfusedWordRequest) returns (AddConfusedWordReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/words/{word_id}/confused"
      body: "*"
    };
  }

  // 获取单词的混淆词列表
  rpc GetConfusedWords (GetConfusedWordsRequest) returns (GetConfusedWordsReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{student_id}/words/{word_id}/confused"
    };
  }

  // 删除混淆词
  rpc RemoveConfusedWord (RemoveConfusedWordRequest) returns (RemoveConfusedWordReply) {
    option (google.api.http) = {
      delete: "/api/v1/students/{student_id}/words/{word_id}/confused/{confused_word_id}"
    };
  }

  // 搜索单词（用于添加混淆词）
  rpc SearchWords (SearchWordsRequest) returns (SearchWordsReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{student_id}/words/search"
    };
  }

  // 标记单词为未记住
  rpc MarkWordForgotten (MarkWordForgottenRequest) returns (MarkWordForgottenReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/words/{word_id}/forget"
      body: "*"
    };
  }

  // 更新单词复习数据（思考时间、难度等）
  rpc UpdateWordReviewData (UpdateWordReviewDataRequest) returns (UpdateWordReviewDataReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/words/{word_id}/review-data"
      body: "*"
    };
  }

  // 生成复习题目
  rpc GenerateReviewQuestions (GenerateReviewQuestionsRequest) returns (GenerateReviewQuestionsReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/words/{word_id}/review-questions"
      body: "*"
    };
  }

  // 创建复习计划
  rpc CreatePlan (CreatePlanRequest) returns (CreatePlanReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/plans"
      body: "*"
    };
  }

  // 获取学生的所有计划
  rpc GetPlans (GetPlansRequest) returns (GetPlansReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{student_id}/plans"
    };
  }

  // 选择计划（设置为当前激活的计划）
  rpc SelectPlan (SelectPlanRequest) returns (SelectPlanReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/plans/{plan_id}/select"
      body: "*"
    };
  }

  // 添加单词到计划
  rpc AddWordsToPlan (AddWordsToPlanRequest) returns (AddWordsToPlanReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/plans/{plan_id}/words"
      body: "*"
    };
  }

  // 从计划中移除单词
  rpc RemoveWordsFromPlan (RemoveWordsFromPlanRequest) returns (RemoveWordsFromPlanReply) {
    option (google.api.http) = {
      delete: "/api/v1/students/{student_id}/plans/{plan_id}/words/{word_id}"
    };
  }

  // 获取计划中的单词列表
  rpc GetPlanWords (GetPlanWordsRequest) returns (GetPlanWordsReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{student_id}/plans/{plan_id}/words"
    };
  }

  // 更新计划
  rpc UpdatePlan (UpdatePlanRequest) returns (UpdatePlanReply) {
    option (google.api.http) = {
      put: "/api/v1/students/{student_id}/plans/{plan_id}"
      body: "*"
    };
  }

  // 删除计划
  rpc DeletePlan (DeletePlanRequest) returns (DeletePlanReply) {
    option (google.api.http) = {
      delete: "/api/v1/students/{student_id}/plans/{plan_id}"
    };
  }
}


message Student {
  int64 id = 1;
  string name = 2;
  string student_no = 3;
  string openid = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message Word {
  int64 id = 1;
  int64 student_id = 2;
  string word = 3;
  string meaning = 4;
  string start_date = 5;
  int32 review_count = 6;
  string last_review_date = 7;
  // 多维度数据
  int32 difficulty = 10;      // 学习难度 (0-10)
  int32 think_time = 11;       // 思考时间（秒）
  bool is_remembered = 12;    // 是否记住
  int32 forget_count = 13;    // 忘记次数
  repeated Word confused_words = 14; // 混淆词列表
  repeated string audio_urls = 15;   // 发音音频 URL 列表
  int64 created_at = 8;
  int64 updated_at = 9;
}

message CreateStudentRequest {
  string name = 1;
  string student_no = 2;
}

message CreateStudentReply {
  BaseResponse ret =1;
  Student student = 2;
}

message GetStudentRequest {
  int64 id = 1;
}

message GetStudentReply {
  BaseResponse ret =1;
  Student student = 2;
}

message BatchAddWordsRequest {
  int64 student_id = 1;
  repeated WordItem words = 2;
}

message WordItem {
  string word = 1;
  string meaning = 2;
  string start_date = 3;
}

message BatchAddWordsReply {
  BaseResponse ret =1;
  int32 count = 2;
  repeated Word words = 3;
}

message GetStudentWordsRequest {
  int64 student_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetStudentWordsReply {
  BaseResponse ret =1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  repeated Word words = 5;
}

message GetTodayWordsRequest {
  int64 student_id = 1;
  string date = 2; // 可选，格式：YYYY-MM-DD，默认为今天
  int64 plan_id = 3; // 计划ID（可选，如果提供则只返回该计划的单词）
}

message GetTodayWordsReply {
  BaseResponse ret =1;
  string date = 2;
  int32 count = 3;
  repeated Word words = 4;
}

message GetPlanTodayWordsRequest {
  int64 student_id = 1;
  int64 plan_id = 2;
  string date = 3; // 可选，格式：YYYY-MM-DD，默认为今天
}

message GetPlanTodayWordsReply {
  BaseResponse ret = 1;
  string date = 2;
  int32 count = 3;
  repeated Word words = 4;
}

message MarkWordReviewedRequest {
  int64 student_id = 1;
  int64 word_id = 2;
}

message MarkWordReviewedReply {
  BaseResponse ret =1;
  Word word = 2;
}

message GetOrCreateStudentByOpenidRequest {
  string openid = 1;  // openid（如果直接提供）
  string code = 2;     // 微信登录code（优先使用，后端会转换为openid）
  string name = 3;     // 可选，用户昵称
}

message GetOrCreateStudentByOpenidReply {
  BaseResponse ret =1;
  Student student = 2;
  bool is_new = 3; // 是否为新创建的学生
}

message AddConfusedWordRequest {
  int64 student_id = 1;
  int64 word_id = 2;
  int64 confused_word_id = 3; // 混淆词的ID
}

message AddConfusedWordReply {
  BaseResponse ret = 1;
  Word word = 2;
}

message GetConfusedWordsRequest {
  int64 student_id = 1;
  int64 word_id = 2;
}

message GetConfusedWordsReply {
  BaseResponse ret = 1;
  repeated Word confused_words = 2;
}

message RemoveConfusedWordRequest {
  int64 student_id = 1;
  int64 word_id = 2;
  int64 confused_word_id = 3;
}

message RemoveConfusedWordReply {
  BaseResponse ret = 1;
}

message SearchWordsRequest {
  int64 student_id = 1;
  string keyword = 2; // 搜索关键词（支持正则表达式）
  int32 limit = 3;    // 返回数量限制，默认20
}

message SearchWordsReply {
  BaseResponse ret = 1;
  repeated Word words = 2;
}

message MarkWordForgottenRequest {
  int64 student_id = 1;
  int64 word_id = 2;
}

message MarkWordForgottenReply {
  BaseResponse ret = 1;
  Word word = 2;
}

message UpdateWordReviewDataRequest {
  int64 student_id = 1;
  int64 word_id = 2;
  int32 think_time = 3;     // 思考时间（秒）
  int32 difficulty = 4;     // 学习难度 (0-10)
  bool is_remembered = 5;   // 是否记住
}

message UpdateWordReviewDataReply {
  BaseResponse ret = 1;
  Word word = 2;
}

message GenerateReviewQuestionsRequest {
  int64 student_id = 1;
  int64 word_id = 2;
  string grade = 3;  // 年级（可选）
}

message GenerateReviewQuestionsReply {
  BaseResponse ret = 1;
  repeated ReviewQuestion questions = 2;
}

message ReviewQuestion {
  string type = 1;              // 题目类型: "multiple_choice" 或 "fill_blank"
  string question = 2;           // 题目内容
  repeated string options = 3;   // 选择题选项（仅选择题有）
  string correct_answer = 4;     // 正确答案
}

message RecognizeWordsFromImageRequest {
  int64 student_id = 1;
  string image_base64 = 2; // base64编码的图片数据（data:image/jpeg;base64,xxx 格式）
  string start_date = 3;    // 开始日期，格式：YYYY-MM-DD
}

message RecognizeWordsFromImageReply {
  BaseResponse ret = 1;
  repeated RecognizedWord recognized_words = 2; // 识别到的单词列表
  int32 total_count = 3;                        // 识别到的单词总数
}

message RecognizedWord {
  string word = 1;        // 识别的单词
  string meaning = 2;     // 识别的释义（如果有，可能为空）
  float confidence = 3;   // 识别置信度（0-1）
  bool auto_added = 4;    // 是否已自动添加到单词列表
}

// 复习计划相关消息
message Plan {
  int64 id = 1;
  int64 student_id = 2;
  string name = 3;
  string grade = 4;
  bool is_active = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message CreatePlanRequest {
  int64 student_id = 1;
  string name = 2;
  string grade = 3;
}

message CreatePlanReply {
  BaseResponse ret = 1;
  Plan plan = 2;
}

message GetPlansRequest {
  int64 student_id = 1;
}

message GetPlansReply {
  BaseResponse ret = 1;
  repeated Plan plans = 2;
}

message SelectPlanRequest {
  int64 student_id = 1;
  int64 plan_id = 2;
}

message SelectPlanReply {
  BaseResponse ret = 1;
  Plan plan = 2;
}

message AddWordsToPlanRequest {
  int64 student_id = 1;
  int64 plan_id = 2;
  repeated int64 word_ids = 3;
}

message AddWordsToPlanReply {
  BaseResponse ret = 1;
  int32 added_count = 2;
}

message RemoveWordsFromPlanRequest {
  int64 student_id = 1;
  int64 plan_id = 2;
  int64 word_id = 3;
}

message RemoveWordsFromPlanReply {
  BaseResponse ret = 1;
}

message GetPlanWordsRequest {
  int64 student_id = 1;
  int64 plan_id = 2;
}

message GetPlanWordsReply {
  BaseResponse ret = 1;
  repeated Word words = 2;
}

message UpdatePlanRequest {
  int64 student_id = 1;
  int64 plan_id = 2;
  string name = 3;
  string grade = 4;
}

message UpdatePlanReply {
  BaseResponse ret = 1;
  Plan plan = 2;
}

message DeletePlanRequest {
  int64 student_id = 1;
  int64 plan_id = 2;
}

message DeletePlanReply {
  BaseResponse ret = 1;
}

