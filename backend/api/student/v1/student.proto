syntax = "proto3";

package api.student.v1;

import "google/api/annotations.proto";
import "common.proto";

option go_package = "backend/api/student/v1;v1";

service StudentService {
  // 添加学生
  rpc CreateStudent (CreateStudentRequest) returns (CreateStudentReply) {
    option (google.api.http) = {
      post: "/api/v1/students"
      body: "*"
    };
  }

  // 获取学生信息
  rpc GetStudent (GetStudentRequest) returns (GetStudentReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{id}"
    };
  }

  // 批量添加单词到学生名下
  rpc BatchAddWords (BatchAddWordsRequest) returns (BatchAddWordsReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/words/batch"
      body: "*"
    };
  }

  // 获取学生的单词列表
  rpc GetStudentWords (GetStudentWordsRequest) returns (GetStudentWordsReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{student_id}/words"
    };
  }

  // 获取今日需要背诵的单词（根据艾宾浩斯曲线）
  rpc GetTodayWords (GetTodayWordsRequest) returns (GetTodayWordsReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{student_id}/words/today"
    };
  }

  // 标记单词为已复习
  rpc MarkWordReviewed (MarkWordReviewedRequest) returns (MarkWordReviewedReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/words/{word_id}/review"
      body: "*"
    };
  }

  // 通过openid获取或创建学生（微信登录）
  rpc GetOrCreateStudentByOpenid (GetOrCreateStudentByOpenidRequest) returns (GetOrCreateStudentByOpenidReply) {
    option (google.api.http) = {
      post: "/api/v1/students/by-openid"
      body: "*"
    };
  }

  // 添加混淆词
  rpc AddConfusedWord (AddConfusedWordRequest) returns (AddConfusedWordReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/words/{word_id}/confused"
      body: "*"
    };
  }

  // 获取单词的混淆词列表
  rpc GetConfusedWords (GetConfusedWordsRequest) returns (GetConfusedWordsReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{student_id}/words/{word_id}/confused"
    };
  }

  // 删除混淆词
  rpc RemoveConfusedWord (RemoveConfusedWordRequest) returns (RemoveConfusedWordReply) {
    option (google.api.http) = {
      delete: "/api/v1/students/{student_id}/words/{word_id}/confused/{confused_word_id}"
    };
  }

  // 搜索单词（用于添加混淆词）
  rpc SearchWords (SearchWordsRequest) returns (SearchWordsReply) {
    option (google.api.http) = {
      get: "/api/v1/students/{student_id}/words/search"
    };
  }

  // 标记单词为未记住
  rpc MarkWordForgotten (MarkWordForgottenRequest) returns (MarkWordForgottenReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/words/{word_id}/forget"
      body: "*"
    };
  }

  // 更新单词复习数据（思考时间、难度等）
  rpc UpdateWordReviewData (UpdateWordReviewDataRequest) returns (UpdateWordReviewDataReply) {
    option (google.api.http) = {
      post: "/api/v1/students/{student_id}/words/{word_id}/review-data"
      body: "*"
    };
  }
}


message Student {
  int64 id = 1;
  string name = 2;
  string student_no = 3;
  string openid = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message Word {
  int64 id = 1;
  int64 student_id = 2;
  string word = 3;
  string meaning = 4;
  string start_date = 5;
  int32 review_count = 6;
  string last_review_date = 7;
  // 多维度数据
  int32 difficulty = 10;      // 学习难度 (0-10)
  int32 think_time = 11;       // 思考时间（秒）
  bool is_remembered = 12;    // 是否记住
  int32 forget_count = 13;    // 忘记次数
  repeated Word confused_words = 14; // 混淆词列表
  int64 created_at = 8;
  int64 updated_at = 9;
}

message CreateStudentRequest {
  string name = 1;
  string student_no = 2;
}

message CreateStudentReply {
  BaseResponse ret =1;
  Student student = 2;
}

message GetStudentRequest {
  int64 id = 1;
}

message GetStudentReply {
  BaseResponse ret =1;
  Student student = 2;
}

message BatchAddWordsRequest {
  int64 student_id = 1;
  repeated WordItem words = 2;
}

message WordItem {
  string word = 1;
  string meaning = 2;
  string start_date = 3;
}

message BatchAddWordsReply {
  BaseResponse ret =1;
  int32 count = 2;
  repeated Word words = 3;
}

message GetStudentWordsRequest {
  int64 student_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetStudentWordsReply {
  BaseResponse ret =1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  repeated Word words = 5;
}

message GetTodayWordsRequest {
  int64 student_id = 1;
  string date = 2; // 可选，格式：YYYY-MM-DD，默认为今天
}

message GetTodayWordsReply {
  BaseResponse ret =1;
  string date = 2;
  int32 count = 3;
  repeated Word words = 4;
}

message MarkWordReviewedRequest {
  int64 student_id = 1;
  int64 word_id = 2;
}

message MarkWordReviewedReply {
  BaseResponse ret =1;
  Word word = 2;
}

message GetOrCreateStudentByOpenidRequest {
  string openid = 1;  // openid（如果直接提供）
  string code = 2;     // 微信登录code（优先使用，后端会转换为openid）
  string name = 3;     // 可选，用户昵称
}

message GetOrCreateStudentByOpenidReply {
  BaseResponse ret =1;
  Student student = 2;
  bool is_new = 3; // 是否为新创建的学生
}

message AddConfusedWordRequest {
  int64 student_id = 1;
  int64 word_id = 2;
  int64 confused_word_id = 3; // 混淆词的ID
}

message AddConfusedWordReply {
  BaseResponse ret = 1;
  Word word = 2;
}

message GetConfusedWordsRequest {
  int64 student_id = 1;
  int64 word_id = 2;
}

message GetConfusedWordsReply {
  BaseResponse ret = 1;
  repeated Word confused_words = 2;
}

message RemoveConfusedWordRequest {
  int64 student_id = 1;
  int64 word_id = 2;
  int64 confused_word_id = 3;
}

message RemoveConfusedWordReply {
  BaseResponse ret = 1;
}

message SearchWordsRequest {
  int64 student_id = 1;
  string keyword = 2; // 搜索关键词（支持正则表达式）
  int32 limit = 3;    // 返回数量限制，默认20
}

message SearchWordsReply {
  BaseResponse ret = 1;
  repeated Word words = 2;
}

message MarkWordForgottenRequest {
  int64 student_id = 1;
  int64 word_id = 2;
}

message MarkWordForgottenReply {
  BaseResponse ret = 1;
  Word word = 2;
}

message UpdateWordReviewDataRequest {
  int64 student_id = 1;
  int64 word_id = 2;
  int32 think_time = 3;     // 思考时间（秒）
  int32 difficulty = 4;     // 学习难度 (0-10)
  bool is_remembered = 5;   // 是否记住
}

message UpdateWordReviewDataReply {
  BaseResponse ret = 1;
  Word word = 2;
}

