syntax = "proto3";

import "errors/errors.proto";

package api.student.v1;
option go_package = "backend/api/student/v1;v1";
enum ErrorReason {
  option (errors.default_code) = 500;
  /////////////////////////////通用错误码(1-100///////////////////////////////

  Success = 0;
  ParamValidate = 1 [(errors.code) = 400];
  DataInsert = 2;
  DataDelete = 3;
  DataUpdate = 4;
  DataQuery = 5;
  DataRecordNotFound = 6;
  Rpc = 7;
  BizDuplicateOp = 8;
  NotFoundHostNetwork = 9;
  Acl = 10;
}